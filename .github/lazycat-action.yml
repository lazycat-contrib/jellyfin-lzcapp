version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: jellyfin

build:
  toolchains: []
  run_buildscript: false

images:
  - id: jellyfin
    target: service
    service: jellyfin
    source: jellyfin/jellyfin
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    # Jellyfin has over 13,000 tags, including development builds.
    max_tags: 20000
    delivery:
      mode: mirror
      image_template: docker.1ms.run/jellyfin/jellyfin:{tag}
      require_digest_match: true

stores:
  official:
    enabled: false
    skip_if_version_exists: false
    retry:
      enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Jellyfin
    summary: Published from GitHub Actions
